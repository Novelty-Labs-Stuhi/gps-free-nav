[project]
name = "gpsfree"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
  "trimesh>=4.5",
  "embreex>=2.17",
  "pillow>=11",
  "meshoptimizer>=0.2",
]

[project.scripts]
gpsfree = "gpsfree.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
