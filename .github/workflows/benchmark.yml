name: benchmark

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find changed experiments
        id: changed
        run: |
          exps=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
            | grep -vE '\.md$' | grep -oE '^experiments/[^/]+' | sort -u \
            | while read d; do [ -f "$d/algo.py" ] && basename "$d"; done | xargs)
          echo "experiments: ${exps:-none}"
          echo "list=$exps" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
        if: steps.changed.outputs.list != ''
        with:
          enable-cache: true
      - uses: actions/cache@v4
        if: steps.changed.outputs.list != ''
        with:
          path: |
            data/worlds
            data/routes
          key: worlds-${{ hashFiles('gpsfree/worlds/**', 'benchmark/worlds/**', 'benchmark/scenarios/**', 'gpsfree/routes.py') }}
          restore-keys: worlds-
      - name: Bake suite worlds and routes (cached; a cold cache takes a few minutes once)
        if: steps.changed.outputs.list != ''
        run: |
          uv run gpsfree fetch --suite --missing --jobs 4
          uv run gpsfree routes --jobs 4
      - name: Re-run changed experiments (12 scenarios x 20 runs each, budget 7 min per experiment)
        if: steps.changed.outputs.list != ''
        run: uv run gpsfree verify ${{ steps.changed.outputs.list }} --max-seconds 420

  leaderboard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run gpsfree leaderboard
      - run: |
          git diff --quiet README.md && exit
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update leaderboard" README.md
          git push
